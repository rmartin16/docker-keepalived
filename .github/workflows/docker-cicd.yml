name: Docker CI/CD

on:
  schedule:
    # builds only keepalived releases not yet published to ghcr.io
    - cron: '20 4 * * *'
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # never cancel an in-progress publish on main; only superseded PR runs
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: rmartin16/keepalived
  BUILD_TARGETS: linux/amd64,linux/386,linux/arm64/v8,linux/arm/v7,linux/arm/v6
  FORCE_PUBLISH: false

jobs:

  # Decide whether the image needs building. Scheduled runs only build
  # unpublished releases; manual runs and tag pushes build everything; pushes
  # and PRs only build when an image input changed.
  Changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 5
    outputs:
      build: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || steps.filter.outputs.image == 'true' }}

    steps:
      - name: Checkout repository
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect changed image inputs
        id: filter
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            image:
              - "Dockerfile"
              - "Makefile"
              - "assets/**"
              - "tests/**"
              - ".github/workflows/docker-cicd.yml"

  Setup:
    runs-on: ubuntu-latest
    needs: [Changes]
    if: needs.Changes.outputs.build == 'true'
    timeout-minutes: 5
    outputs:
      date: ${{ steps.set-date.outputs.date }}
      versions: ${{ steps.set-keepalived-versions.outputs.versions }}
      latest-version: ${{ steps.set-keepalived-versions.outputs.latest-version }}
    steps:
      - name: Declare Date
        id: set-date
        run: echo "date=$(date +'%Y%m%d')" >> ${GITHUB_OUTPUT}

      - name: Declare keepalived Versions
        id: set-keepalived-versions
        run: |  # find version 2.2+
          # 2.2.0-2.2.2 have different build requirements; 2.2.5 and 2.2.6 were not actually released
          EXCLUDED="2.2.0 2.2.1 2.2.2 2.2.5 2.2.6"
          VERS=$( \
            git -c 'versionsort.suffix=-' ls-remote --tags --sort='v:refname' https://github.com/acassen/keepalived.git | \
            cut --delimiter='/' --fields=3 | \
            grep -v "\^{}" | \
            cut --delimiter='-' --fields=2 | \
            grep -E '^v2\.[2-9]\.[0-9]+$' | \
            sed 's/v//g' | \
            grep -vxF -f <(printf '%s\n' ${EXCLUDED})
          )

          LATEST_VER=$(echo ${VERS} | rev | cut -d' ' -f1 | rev)
          echo "Latest: ${LATEST_VER}"
          echo "latest-version=${LATEST_VER}" >> ${GITHUB_OUTPUT}

          if [ "${{ github.event_name }}" = "schedule" ]; then
            # the image is public, so an anonymous pull token can list its tags
            TOKEN=$(curl -fsS "https://${REGISTRY}/token?scope=repository:${IMAGE_NAME}:pull" | jq -r .token)
            PUBLISHED=$(curl -fsS -H "Authorization: Bearer ${TOKEN}" "https://${REGISTRY}/v2/${IMAGE_NAME}/tags/list?n=10000" | jq -r '.tags[]')
            MISSING=""
            for VER in ${VERS}; do
              grep -qxF "v${VER}" <<< "${PUBLISHED}" || MISSING="${MISSING} ${VER}"
            done
            echo "Unpublished: ${MISSING:-none}"
            VERS=${MISSING}
          fi

          VERS_MATRIX_LIST=$(printf '%s\n' ${VERS} | jq -Rnc '[inputs | select(length > 0)]')
          echo ${VERS_MATRIX_LIST}
          echo "versions=${VERS_MATRIX_LIST}" >> ${GITHUB_OUTPUT}

  # Each version is built and tested for amd64 (plus image tests for arm64
  # under QEMU) before the multi-arch build reuses those cached layers and
  # pushes; a version whose tests fail is never published.
  Build:
    name: Build, test, publish (${{ matrix.VERSION }})
    runs-on: ubuntu-latest
    needs: [Setup]
    if: needs.Setup.outputs.versions != '[]'
    permissions:
      contents: read
      packages: write
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        VERSION: ${{ fromJson(needs.Setup.outputs.versions) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Log into registry ${{ env.REGISTRY }}
        if: (github.event_name != 'pull_request') || (env.FORCE_PUBLISH == 'true')
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          labels: |
            maintainer=${{ github.repository_owner }}
            org.opencontainers.image.title=keepalived
            org.opencontainers.image.description=keepalived v${{ matrix.VERSION }} (${{ needs.Setup.outputs.date }})
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.version=v${{ matrix.VERSION }}-${{ needs.Setup.outputs.date }}
          tags: |
            type=raw,value=v${{ matrix.VERSION }}
            type=raw,value=v${{ matrix.VERSION }}-${{ needs.Setup.outputs.date }}
            type=raw,value=latest,enable=${{ matrix.VERSION == needs.Setup.outputs.latest-version }}
            type=ref,event=pr

      - name: Build amd64 image for testing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: keepalived:test-amd64
          platforms: linux/amd64
          build-args: KEEPALIVED_VERSION=${{ matrix.VERSION }}

      - name: Test amd64 image
        run: make test-image
        env:
          IMAGE: keepalived:test-amd64

      - name: Test failover
        run: make test-failover
        env:
          IMAGE: keepalived:test-amd64

      - name: Build arm64 image for testing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: keepalived:test-arm64
          platforms: linux/arm64/v8
          build-args: KEEPALIVED_VERSION=${{ matrix.VERSION }}

      - name: Test arm64 image
        run: make test-image
        env:
          IMAGE: keepalived:test-arm64
          PLATFORM: linux/arm64/v8

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ (github.event_name != 'pull_request') || (env.FORCE_PUBLISH == 'true') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ env.BUILD_TARGETS }}
          build-args: KEEPALIVED_VERSION=${{ matrix.VERSION }}

      - name: Verify image
        if: github.event_name != 'pull_request'
        run: |
          docker pull ${REGISTRY}/${IMAGE_NAME}:v${{ matrix.VERSION }}-${{ needs.Setup.outputs.date }}
          docker image inspect ${REGISTRY}/${IMAGE_NAME}:v${{ matrix.VERSION }}-${{ needs.Setup.outputs.date }}
